<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的极简内容平台</title>
    <link rel="stylesheet" href="/template/style.css">
</head>
<body>

    <!-- 1. 悬浮控制面板组 -->
    <div id="dock-container">

        <!-- 方块一：排版调节面板 -->
        <div class="panel-box" id="panel-config">
            <div class="panel-header">
                <span class="panel-icon">⚙️</span>
                <span class="panel-title">版面调节</span>
                <button class="min-btn">➖</button>
            </div>
            <div class="panel-content">
                <div class="control-group">
                    <label>版面宽度：</label>
                    <input type="range" id="width-slider" min="400" max="1200" value="700">
                    <span id="width-val">700px</span>
                </div>
                <div class="control-group">
                    <label>文字大小：</label>
                    <input type="range" id="size-slider" min="14" max="32" value="18">
                    <span id="size-val">18px</span>
                </div>
                <div class="control-group">
                    <label>版面位置：</label>
                    <input type="range" id="position-slider" min="-100" max="100" value="0">
                    <span id="position-val">居中</span>
                </div>
                <div class="control-group">
                    <label>文本行距：</label>
                    <input type="range" id="line-slider" min="1.2" max="2.5" step="0.1" value="1.7">
                    <span id="line-val">1.7</span>
                </div>
                <div class="control-group">
                    <label>文字颜色：</label>
                    <input type="color" id="color-text" value="#222222">
                    <label>背景：</label>
                    <input type="color" id="color-bg" value="#fbfbfb">
                </div>
            </div>
        </div>

        <!-- 方块二：字体矩阵配置面板（抽离为独立卡片） -->
        <div class="panel-box" id="panel-font-matrix">
            <div class="panel-header">
                <span class="panel-icon">🔤</span>
                <span class="panel-title">字体矩阵配置</span>
                <button class="min-btn">➖</button>
            </div>
            <div class="panel-content">
                <table class="font-matrix-table">
                    <thead>
                        <tr>
                            <th>区域</th>
                            <th title="原生/继承">继承</th>
                            <th title="无衬线不等宽">比例无衬</th>
                            <th title="衬线不等宽">比例衬线</th>
                            <th title="无衬线等宽">等宽无衬</th>
                            <th title="衬线等宽">等宽衬线</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 1. 正文 -->
                        <tr>
                            <td class="row-label">正文</td>
                            <td><input type="radio" name="font-body" value="inherit" checked></td>
                            <td><input type="radio" name="font-body" value="sans-prop"></td>
                            <td><input type="radio" name="font-body" value="serif-prop"></td>
                            <td><input type="radio" name="font-body" value="sans-mono"></td>
                            <td><input type="radio" name="font-body" value="serif-mono"></td>
                        </tr>
                        <!-- 2. 代码 -->
                        <tr>
                            <td class="row-label">代码</td>
                            <td><input type="radio" name="font-code" value="inherit"></td>
                            <td><input type="radio" name="font-code" value="sans-prop"></td>
                            <td><input type="radio" name="font-code" value="serif-prop"></td>
                            <td><input type="radio" name="font-code" value="sans-mono" checked></td>
                            <td><input type="radio" name="font-code" value="serif-mono"></td>
                        </tr>
                        <!-- 3. 标题 -->
                        <tr>
                            <td class="row-label">标题</td>
                            <td><input type="radio" name="font-heading" value="inherit" checked></td>
                            <td><input type="radio" name="font-heading" value="sans-prop"></td>
                            <td><input type="radio" name="font-heading" value="serif-prop"></td>
                            <td><input type="radio" name="font-heading" value="sans-mono"></td>
                            <td><input type="radio" name="font-heading" value="serif-mono"></td>
                        </tr>
                        <!-- 4. 链接 -->
                        <tr>
                            <td class="row-label">链接</td>
                            <td><input type="radio" name="font-link" value="inherit" checked></td>
                            <td><input type="radio" name="font-link" value="sans-prop"></td>
                            <td><input type="radio" name="font-link" value="serif-prop"></td>
                            <td><input type="radio" name="font-link" value="sans-mono"></td>
                            <td><input type="radio" name="font-link" value="serif-mono"></td>
                        </tr>
                        <!-- 5. 引用/脚注 -->
                        <tr>
                            <td class="row-label">引用</td>
                            <td><input type="radio" name="font-quote" value="inherit" checked></td>
                            <td><input type="radio" name="font-quote" value="sans-prop"></td>
                            <td><input type="radio" name="font-quote" value="serif-prop"></td>
                            <td><input type="radio" name="font-quote" value="sans-mono"></td>
                            <td><input type="radio" name="font-quote" value="serif-mono"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 方块三：大纲目录面板 -->
        <div class="panel-box" id="panel-toc">
            <div class="panel-header">
                <span class="panel-icon">📜</span>
                <span class="panel-title">文章大纲</span>
                <button class="min-btn">➖</button>
            </div>
            <div class="panel-content scrollable">
                <div id="toc-container">正在加载大纲...</div>
            </div>
        </div>

        <!-- 方块四：所有文章面板 -->
        <div class="panel-box" id="panel-tree">
            <div class="panel-header">
                <span class="panel-icon">📁</span>
                <span class="panel-title">文章列表</span>
                <button class="min-btn">➖</button>
            </div>
            <div class="panel-content scrollable">
                <div id="tree-container">正在载入归档...</div>
            </div>
        </div>

    </div>

    <!-- 2. 正文核心包裹区 -->
    <div id="article-wrapper">
        <main id="article-container">
            <p>正在读取正文内容...</p>
        </main>
    </div>

    <script src="/template/script.js"></script>
</body>
</html>
