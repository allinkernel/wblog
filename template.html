<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的极简内容平台</title>
    <link rel="stylesheet" href="/template/css/base.css">
    <link rel="stylesheet" href="/template/css/theme.css">
    <link rel="stylesheet" href="/template/css/panels.css">
    <link rel="stylesheet" href="/template/css/code.css">
    <link rel="stylesheet" href="/template/css/bottom-bar.css">
</head>
<body>

    <!-- 1. 左侧悬浮坞 -->
    <div id="left-dock-container">
        <!-- 文章列表 -->
        <div class="panel-box" id="panel-tree">
            <div class="panel-header" title="点击切换显示/隐藏">
                <span class="panel-icon">📁</span>
                <span class="panel-title">文章列表</span>
            </div>
            <div class="panel-content" id="tree-container">正在载入归档...</div>
        </div>

        <!-- 文章大纲 -->
        <div class="panel-box" id="panel-toc">
            <div class="panel-header" title="点击切换显示/隐藏">
                <span class="panel-icon">📜</span>
                <span class="panel-title">文章大纲</span>
            </div>
            <div class="panel-content scrollable" id="toc-container">正在加载大纲...</div>
        </div>
    </div>

    <!-- 2. 右侧悬浮坞 -->
    <div id="right-dock-container">
        <!-- 版面调节 -->
        <div class="panel-box" id="panel-config">
            <div class="panel-header" title="点击切换显示/隐藏">
                <span class="panel-icon">⚙️</span>
                <span class="panel-title">版面调节</span>
            </div>
            <div class="panel-content">
                <!-- 画布小手 Switch -->
                <div class="control-group">
                    <label>画布小手：</label>
                    <label class="switch">
                        <input type="checkbox" id="canvas-toggle">
                        <span class="slider">
                            <span class="slider-text text-on">ON</span>
                            <span class="slider-text text-off">OFF</span>
                            <span class="knob"></span>
                        </span>
                    </label>
                </div>

                <div class="control-group">
                    <label>版面宽度：</label>
                    <div class="slider-container">
                        <button class="slider-btn" data-target="width-slider" data-step="-20">-</button>
                        <input type="range" id="width-slider" min="400" max="1200" value="700" step="10">
                        <button class="slider-btn" data-target="width-slider" data-step="20">+</button>
                    </div>
                    <span class="val-badge" id="width-val">700px</span>
                </div>

                <div class="control-group">
                    <label>版面位置：</label>
                    <div class="slider-container">
                        <button class="slider-btn" data-target="position-slider" data-step="-10">-</button>
                        <input type="range" id="position-slider" min="-100" max="100" value="0">
                        <button class="slider-btn" data-target="position-slider" data-step="10">+</button>
                    </div>
                    <span class="val-badge" id="position-val">居中</span>
                </div>
            </div>
        </div>

        <!-- 字体调节 -->
        <div class="panel-box" id="panel-font">
            <div class="panel-header" title="点击切换显示/隐藏">
                <span class="panel-icon icon-aa">Aa</span>
                <span class="panel-title">字体调节</span>
            </div>
            <div class="panel-content">
                <div class="control-group">
                    <label>文字大小：</label>
                    <div class="slider-container">
                        <button class="slider-btn" data-target="size-slider" data-step="-1">-</button>
                        <input type="range" id="size-slider" min="14" max="32" value="18">
                        <button class="slider-btn" data-target="size-slider" data-step="1">+</button>
                    </div>
                    <span class="val-badge" id="size-val">18px</span>
                </div>

                <div class="control-group">
                    <label>文本行距：</label>
                    <div class="slider-container">
                        <button class="slider-btn" data-target="line-slider" data-step="-0.1">-</button>
                        <input type="range" id="line-slider" min="1.2" max="2.5" step="0.1" value="1.7">
                        <button class="slider-btn" data-target="line-slider" data-step="0.1">+</button>
                    </div>
                    <span class="val-badge" id="line-val">1.7</span>
                </div>

                <div class="control-group">
                    <label>文字颜色：</label>
                    <input type="color" id="color-text" value="#222222">
                    <label style="margin-left: 6px;">背景：</label>
                    <input type="color" id="color-bg" value="#fbfbfb">
                </div>

                <div class="panel-inner-divider"></div>

                <table class="font-matrix-table">
                    <thead>
                        <tr>
                            <th>区域</th>
                            <th title="原生/继承">继承</th>
                            <th title="无衬线不等宽"><span class="font-sample sample-sans-prop">AiaI</span></th>
                            <th title="衬线不等宽"><span class="font-sample sample-serif-prop">AiaI</span></th>
                            <th title="无衬线等宽"><span class="font-sample sample-sans-mono">AiaI</span></th>
                            <th title="衬线等宽"><span class="font-sample sample-serif-mono">AiaI</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="row-label">正文</td>
                            <td><input type="radio" name="font-body" value="inherit" checked></td>
                            <td><input type="radio" name="font-body" value="sans-prop"></td>
                            <td><input type="radio" name="font-body" value="serif-prop"></td>
                            <td><input type="radio" name="font-body" value="sans-mono"></td>
                            <td><input type="radio" name="font-body" value="serif-mono"></td>
                        </tr>
                        <tr>
                            <td class="row-label">代码</td>
                            <td><input type="radio" name="font-code" value="inherit"></td>
                            <td><input type="radio" name="font-code" value="sans-prop"></td>
                            <td><input type="radio" name="font-code" value="serif-prop"></td>
                            <td><input type="radio" name="font-code" value="sans-mono" checked></td>
                            <td><input type="radio" name="font-code" value="serif-mono"></td>
                        </tr>
                        <tr>
                            <td class="row-label">标题</td>
                            <td><input type="radio" name="font-heading" value="inherit" checked></td>
                            <td><input type="radio" name="font-heading" value="sans-prop"></td>
                            <td><input type="radio" name="font-heading" value="serif-prop"></td>
                            <td><input type="radio" name="font-heading" value="sans-mono"></td>
                            <td><input type="radio" name="font-heading" value="serif-mono"></td>
                        </tr>
                        <tr>
                            <td class="row-label">链接</td>
                            <td><input type="radio" name="font-link" value="inherit" checked></td>
                            <td><input type="radio" name="font-link" value="sans-prop"></td>
                            <td><input type="radio" name="font-link" value="serif-prop"></td>
                            <td><input type="radio" name="font-link" value="sans-mono"></td>
                            <td><input type="radio" name="font-link" value="serif-mono"></td>
                        </tr>
                        <tr>
                            <td class="row-label">引用</td>
                            <td><input type="radio" name="font-quote" value="inherit" checked></td>
                            <td><input type="radio" name="font-quote" value="sans-prop"></td>
                            <td><input type="radio" name="font-quote" value="serif-prop"></td>
                            <td><input type="radio" name="font-quote" value="sans-mono"></td>
                            <td><input type="radio" name="font-quote" value="serif-mono"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 样式调节 -->
        <div class="panel-box" id="panel-style">
            <div class="panel-header" title="点击切换显示/隐藏">
                <span class="panel-icon icon-rgb">
                    <span class="rgb-dot rgb-r"></span>
                    <span class="rgb-dot rgb-g"></span>
                    <span class="rgb-dot rgb-b"></span>
                </span>
                <span class="panel-title">样式调节</span>
            </div>
            <div class="panel-content">
                <div class="control-group">
                    <label>阅读主题：</label>
                    <select id="reader-theme-select">
                        <option value="custom">自定义 / 当前颜色</option>
                        <option value="github-light">GitHub Light</option>
                        <option value="github-dark">GitHub Dark</option>
                        <option value="claude-light">Claude 暖白</option>
                        <option value="claude-dark">Claude 暗夜</option>
                        <option value="notion-light">Notion Light</option>
                        <option value="solarized-light">Solarized Light</option>
                        <option value="solarized-dark">Solarized Dark</option>
                        <option value="dracula">Dracula</option>
                        <option value="stack-overflow">Stack Overflow</option>
                        <option value="catppuccin-latte">Catppuccin Latte</option>
                        <option value="catppuccin-mocha">Catppuccin Mocha</option>
                        <option value="nord">Nord</option>
                        <option value="texi2html">texi2html 纯粹经典</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>引用样式：</label>
                    <select id="quote-style-select">
                        <option value="global">跟随全局主题</option>
                        <option value="default">默认左边框</option>
                        <option value="accent">强调色块</option>
                        <option value="card">卡片高亮</option>
                        <option value="mark">大引号风格</option>
                        <option value="plain">极简无边框</option>
                        <option value="dashed">虚线边框</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 代码样式调节 -->
        <div class="panel-box" id="panel-code-style">
            <div class="panel-header" title="点击切换显示/隐藏">
                <span class="panel-icon icon-code">&lt;/&gt;</span>
                <span class="panel-title">代码样式调节</span>
            </div>
            <div class="panel-content">
                <div class="control-group">
                    <label>显示格式：</label>
                    <select id="code-format-select">
                        <option value="scroll">同宽 + 横向滚动</option>
                        <option value="wrap">同宽 + 自动换行</option>
                        <option value="adaptive">自适应最长行</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>块级主题：</label>
                    <select id="code-theme-select">
                        <option value="default">默认浅色</option>
                        <option value="dark">暗黑极客</option>
                        <option value="github-dark">GitHub Dark</option>
                        <option value="solarized">Solarized Dark</option>
                        <option value="github-light">GitHub Light</option>
                        <option value="dracula">Dracula</option>
                        <option value="nord">Nord</option>
                        <option value="one-dark">One Dark</option>
                        <option value="one-light">Atom One Light</option>
                        <option value="wildcharm">Wildcharm</option>
                        <option value="nightfox">Nightfox</option>
                        <option value="tokyonight">TokyoNight</option>
                        <option value="global">跟随全局阅读主题</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>行内主题：</label>
                    <select id="code-inline-theme-select">
                        <option value="default">默认灰色</option>
                        <option value="dark">暗黑极客</option>
                        <option value="github">GitHub 风格</option>
                        <option value="warm">柔和暖红</option>
                        <option value="amber">琥珀黄</option>
                        <option value="mist">雾蓝柔和</option>
                        <option value="sage">鼠尾草柔和</option>
                        <option value="lavender">淡紫柔和</option>
                        <option value="cream">奶油柔和</option>
                        <option value="global">跟随全局阅读主题</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>行内字号：</label>
                    <div class="slider-container">
                        <button class="slider-btn" data-target="code-inline-slider" data-step="-1">-</button>
                        <input type="range" id="code-inline-slider" min="-8" max="8" step="1" value="-2">
                        <button class="slider-btn" data-target="code-inline-slider" data-step="1">+</button>
                    </div>
                    <span class="val-badge" id="code-inline-val">-2px</span>
                </div>

                <div class="control-group">
                    <label>行内边距：</label>
                    <div class="slider-container">
                        <button class="slider-btn" data-target="code-inline-pad-slider" data-step="-1">-</button>
                        <input type="range" id="code-inline-pad-slider" min="0" max="6" step="1" value="2">
                        <button class="slider-btn" data-target="code-inline-pad-slider" data-step="1">+</button>
                    </div>
                    <span class="val-badge" id="code-inline-pad-val">2px</span>
                </div>

                <div class="control-group">
                    <label>块级字号：</label>
                    <div class="slider-container">
                        <button class="slider-btn" data-target="code-block-slider" data-step="-1">-</button>
                        <input type="range" id="code-block-slider" min="10" max="26" value="14">
                        <button class="slider-btn" data-target="code-block-slider" data-step="1">+</button>
                    </div>
                    <span class="val-badge" id="code-block-val">14px</span>
                </div>

                <div class="panel-inner-divider"></div>

                <div class="control-group">
                    <label>显示行号：</label>
                    <label class="switch">
                        <input type="checkbox" id="code-line-numbers-toggle" checked>
                        <span class="slider">
                            <span class="slider-text text-on">ON</span>
                            <span class="slider-text text-off">OFF</span>
                            <span class="knob"></span>
                        </span>
                    </label>
                </div>

                <div class="control-group">
                    <label>顶部工具栏：</label>
                    <label class="switch">
                        <input type="checkbox" id="code-header-toggle" checked>
                        <span class="slider">
                            <span class="slider-text text-on">ON</span>
                            <span class="slider-text text-off">OFF</span>
                            <span class="knob"></span>
                        </span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 新增：表格样式调节 -->
        <div class="panel-box" id="panel-table-style">
            <div class="panel-header" title="点击切换显示/隐藏">
                <span class="panel-icon">⊞</span>
                <span class="panel-title">表格样式调节</span>
            </div>
            <div class="panel-content">
                <div class="control-group">
                    <label>显示格式：</label>
                    <select id="table-format-select">
                        <option value="adaptive">自适应内容</option>
                        <option value="wrap">自动换行</option>
                        <option value="scroll">横向滚动</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>隐藏标题栏：</label>
                    <label class="switch">
                        <input type="checkbox" id="table-header-toggle">
                        <span class="slider">
                            <span class="slider-text text-on">ON</span>
                            <span class="slider-text text-off">OFF</span>
                            <span class="knob"></span>
                        </span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 正文核心包裹区 -->
    <div id="article-wrapper">
        <main id="article-container">
            <p>正在读取正文内容...</p>
        </main>
    </div>

    <!-- 4. 底部紧凑 Bar -->
    <div id="bottom-bar">
        <!-- 拖动把手 -->
        <div class="bar-drag-handle" title="拖动移动 bar">
            <span class="drag-dot"></span><span class="drag-dot"></span><span class="drag-dot"></span>
            <span class="drag-dot"></span><span class="drag-dot"></span><span class="drag-dot"></span>
        </div>

        <div class="bar-group">
            <!-- 明暗主题切换 -->
            <button id="bar-theme" class="bar-btn" title="切换明暗主题">
                <span class="bar-icon">☀️</span>
                <span class="bar-label">亮色</span>
            </button>
            <button id="bar-canvas" class="bar-btn" title="画布小手切换">
                <span class="bar-icon">🖐️</span>
                <span class="bar-label">小手</span>
            </button>
        </div>

        <div class="bar-divider"></div>

        <div class="bar-group">
            <button id="bar-tree" class="bar-btn" title="文章列表">
                <span class="bar-icon">📁</span>
                <span class="bar-label">文章</span>
            </button>
            <button id="bar-toc" class="bar-btn" title="文章大纲">
                <span class="bar-icon">📜</span>
                <span class="bar-label">大纲</span>
            </button>
        </div>

        <div class="bar-divider"></div>

        <div class="bar-group">
            <button id="bar-config" class="bar-btn" title="版面调节">
                <span class="bar-icon">⚙️</span>
                <span class="bar-label">版面</span>
            </button>
            <button id="bar-font" class="bar-btn" title="字体调节">
                <span class="bar-icon">Aa</span>
                <span class="bar-label">字体</span>
            </button>
            <button id="bar-style" class="bar-btn" title="样式调节">
                <span class="bar-icon">🎨</span>
                <span class="bar-label">样式</span>
            </button>
            <button id="bar-code" class="bar-btn" title="代码样式">
                <span class="bar-icon">&lt;/&gt;</span>
                <span class="bar-label">代码</span>
            </button>
            <button id="bar-table" class="bar-btn" title="表格样式">
                <span class="bar-icon">⊞</span>
                <span class="bar-label">表格</span>
            </button>
        </div>
    </div>

    <script src="/template/js/theme.js"></script>
    <script src="/template/js/code.js"></script>
    <script src="/template/js/navigation.js"></script>
    <script src="/template/js/controls.js"></script>
    <script src="/template/js/main.js"></script>
</body>
</html>
